name: ERP v2 tenant-isolation PostgreSQL integration tests

on:
  pull_request:
    paths:
      - 'drizzle/migrations/0006_erp2_org_scoped_foundation.sql'
      - 'scripts/sql/erp2-*.sql'
      - '.github/workflows/erp-v2-db-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Two-tenant SQL / ACL / idempotency acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ympharma_erp2_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ympharma_erp2_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      PGPASSWORD: synthetic-ci-only
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: ympharma_erp2_test
    steps:
      - uses: actions/checkout@v4
      - name: Verify PostgreSQL CLI
        run: psql --version
      - name: Create synthetic organization, product, and warehouse tables
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/erp2-ci-fixtures.sql
      - name: Apply ERP2 migration to disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f drizzle/migrations/0006_erp2_org_scoped_foundation.sql
      - name: Verify tenant isolation, replay, and precision with real SQL
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/erp2-org-isolation-acceptance.sql
