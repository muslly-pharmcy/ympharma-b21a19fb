name: YmPharma device build gates (non-release)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/ympharma-device-builds.yml'

permissions:
  contents: read

jobs:
  android-debug:
    name: Android APK debug compilation (no release signing)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Build Capacitor web assets
        run: bun run build:android
      - name: Synchronize native Android assets and plugins
        run: bunx cap sync android
      - name: Build a debug-only APK from the checked-in Gradle wrapper
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Save debug APK for instrumented physical-device testing
        uses: actions/upload-artifact@v4
        with:
          name: ympharma-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  windows-browser:
    name: Windows PWA/RTL browser regression (not MSIX)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Build Windows-compatible web target
        run: bun run build
      - name: Install Chromium
        run: bunx playwright install chromium
      - name: Run connection and offline page regressions (synthetic)
        env:
          E2E_MOCK_SERVER: '1'
        run: bunx playwright test e2e/connection-repair.e2e.ts
