name: Legacy stock RPC PostgreSQL 17 integration

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'supabase/migrations/**'
      - 'drizzle/migrations/**'
      - '.github/workflows/ci.yml'
      - 'supabase/migrations/20261116021000_guard_legacy_inv_adjust_stock.sql'
      - 'scripts/sql/legacy-stock-rpc-*'
      - '.github/workflows/legacy-stock-rpc-db-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql-acceptance:
    name: Reservation / ACL / movement / concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ympharma_legacy_stock_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ympharma_legacy_stock_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      PGPASSWORD: synthetic-ci-only
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: ympharma_legacy_stock_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned
      - name: PostgreSQL 17 available
        run: psql --version
      - name: Build synthetic isolated organizations and batches
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/legacy-stock-rpc-ci-fixtures.sql
      - name: Apply SQL patch to disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261116021000_guard_legacy_inv_adjust_stock.sql
      - name: Verify actual SQL behavior and required privileges
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/legacy-stock-rpc-acceptance.sql
      - name: Verify two competing decrements
        run: bash scripts/sql/legacy-stock-rpc-concurrency.sh
      - name: Verify 500 competing stock adjustments (32 parallel sessions)
        run: python3 scripts/sql/legacy-stock-rpc-500-attempts.py
      - name: Restore synthetic backup and verify data and reservation guard
        run: bash scripts/sql/legacy-stock-rpc-recovery.sh
