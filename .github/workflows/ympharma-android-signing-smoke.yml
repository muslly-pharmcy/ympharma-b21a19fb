name: Android Gradle release-signing regression (debug-safe)

on:
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/ympharma-android-release.yml'
      - '.github/workflows/ympharma-android-signing-smoke.yml'

permissions:
  contents: read

jobs:
  debug-and-unsigned-release-guard:
    name: Debug still builds; unsigned release denied
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build and synchronize Capacitor
        run: |
          bun run build:android
          bunx cap sync android
      - name: Verify release tasks fail closed without signing secrets
        working-directory: android
        shell: bash
        run: |
          chmod +x ./gradlew
          if ./gradlew :app:assembleRelease --no-daemon > unsigned-release-test.log 2>&1; then
            echo "::error::Unsigned Android Release was incorrectly allowed"
            exit 1
          fi
          if ! grep -q 'YmPharma Android Release signing configuration is missing' unsigned-release-test.log; then
            echo "::error::Release task failed for another reason, not the expected signing guard"
            tail -n 25 unsigned-release-test.log
            exit 1
          fi
      - name: Verify normal debug APK still builds
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Upload debug-only smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: ympharma-android-debug-signing-smoke
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
