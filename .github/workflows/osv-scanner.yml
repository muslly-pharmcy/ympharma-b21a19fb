name: OSV-Scanner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "yarn.lock"
      - "pnpm-lock.yaml"
      - "bun.lock"
      - "bun.lockb"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "yarn.lock"
      - "pnpm-lock.yaml"
      - "bun.lock"
      - "bun.lockb"
  schedule:
    - cron: "0 0 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: OSV Security Scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
